# Netlify deployment configuration for the CCNA Path Astro site.
# The site is fully static (SSG): Netlify builds with `astro build`
# and publishes the generated `dist/` directory.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Clean URLs: Netlify serves /labs/foo/ from /labs/foo/index.html automatically.
# This catch-all preserves our Astro 404 for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Long-term caching for build-hashed assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
